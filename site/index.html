    <!-- Apply the saved theme/language before first paint (no flash of the wrong theme) -->
    <script>
      (function () {
        try {
          var r = document.documentElement;
          var t = localStorage.getItem("portfolio-theme");
          if (t === "gradient") t = "custom";
          if (t !== "light" && t !== "dark" && t !== "custom") t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          r.dataset.theme = t;
          if (t !== "light") r.classList.add("dark");
          r.style.colorScheme = t === "light" ? "light" : "dark";
          var l = localStorage.getItem("portfolio-language");
          if (l === "ne" || l === "hi") r.lang = l; else if (l === "zh") r.lang = "zh-CN";
        } catch (e) {}
      })();
    </script>
